name: build

on:
  push:
    branches: [main, master]
    # A release version is published from a tag, never from a push: the version is
    # a fixed number now, and Maven Central will not accept the same one twice,
    # so a push-triggered publish would fail on the second commit. Pushes to the
    # default branch still build and test; only a tag publishes.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper jar against the published checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew build --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  native:
    name: tests as a native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v6

      # Gson populates this library's types by reflection, which a native image strips unless the
      # shipped metadata says otherwise — and the failure is silent: fields come back null and a
      # valid config is rejected as malformed. Running the suite natively is what catches that.
      - name: Run the test suite as a native image
        run: ./gradlew nativeTest --stacktrace

      - name: Upload native test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-report
          path: build/reports/tests
          retention-days: 7

  publish:
    name: publish to Maven Central
    # Only once both jobs agree the library works, and only for a tag: a package is not
    # something to take back, and containerd-java resolves it from Central.
    needs: [unit, native]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Before the upload, not after: publishing 0.22.0 under the tag v0.21.0 would spend
      # a version number on the wrong build, and a package version cannot be reused.
      - name: Check the tag matches the version in the build
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oP '^version = "\K[^"]+' build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "could not read the version from build.gradle.kts" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $version"

      - name: Publish
        run: ./gradlew publishAggregationToCentralPortal --stacktrace
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
