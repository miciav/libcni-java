name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper jar against the published checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew build --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  native:
    name: tests as a native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v6

      # Gson populates this library's types by reflection, which a native image strips unless the
      # shipped metadata says otherwise — and the failure is silent: fields come back null and a
      # valid config is rejected as malformed. Running the suite natively is what catches that.
      - name: Run the test suite as a native image
        run: ./gradlew nativeTest --stacktrace

      - name: Upload native test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-report
          path: build/reports/tests
          retention-days: 7
